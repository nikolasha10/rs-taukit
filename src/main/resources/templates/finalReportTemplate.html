<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <style>
        body {margin: 0px; padding: 0px}
        .active {color: #ffd050;}
        #buttonRun {margin: 20px; padding: 10px;}
        .started {border: 1px solid green; background-color: #a0ffa0; }
        .expander {padding: 3px 15px 3px 3px;}
        .passed{
            position: absolute;
            color: #008f00;
            font-size: 17px;
            transform: translate(-4px, -12px);
        }
        .skipped{
            position: absolute;
            color: gray;
            font-size: 17px;
            font-weight: bold;
            transform: translate(-1px, -10px);
        }
        .toggle {
            position: absolute;
            border: 7px solid transparent;
            filter: drop-shadow(0px 0px 1px #284358);
            cursor: pointer;
        }

        .shrink.failed{
            border-top: 10px solid #cf0000;
            transform: translate(-3px, -5px);
        }
        .shrink.broken{
            border-top: 10px solid #ffd050;
            transform: translate(-3px, -5px);
        }
        .shrink.unknown{
            border-top: 10px solid #d35ebe;
            transform: translate(-3px, -5px);
        }
        .shrink.successful {
            border-top: 10px solid #00cf00;
            transform: translate(-3px, -5px);
        }
        .shrink.warning {
            border-top: 10px solid #F0e084;
            transform: translate(-3px, -5px);
        }

        .expand.successful{
            border-left: 10px solid #00cf00;
            filter: drop-shadow(0px 0px 1px #284358);
            transform: translate(0px, -7px);
        }
        .expand.warning{
            border-left: 10px solid #F0e084;
            filter: drop-shadow(0px 0px 1px #284358);
            transform: translate(0px, -7px);
        }
        .expand.failed{
            border-left: 10px solid #cf0000;
            transform: translate(0px, -7px);
        }
        .expand.broken{
            border-left: 10px solid #ffd050;
            transform: translate(0px, -7px);
        }
        .expand.unknown{
            border-left: 10px solid #d35ebe;
            transform: translate(0px, -7px);
        }
        .error {
                background-color: #FFF2C2;
                padding: 5px;
                color: black;
                box-shadow: inset 1px 1px 1px #284358;
                margin: 0 0 5px 0;
        }
        .hidden {display: none}

        #container_main { display: grid; grid-template-columns: max-content auto;}
        #container_menu_main { position: absolute; background: #284358; padding-right: 15px;  width: 150px; height: 100%; overflow-y: auto; overflow-x: hidden; z-index: 2}
        .check::before {
            content: "✓";
            color: yellow;
        }
        #container_content { position: absolute; right: 0px; top: 0px; bottom: 0px; overflow: auto; background-color: #BFCbCe; padding: 5px 10px 5px 10px; z-index: 1;}
        #scenarioTreeContainer { position: absolute; overflow: auto; padding-top: 0px;}
        .test-counters {
            font-weight: bold;
        }
        .test-counters span{
            margin-right: 15px;
            padding: 3px 5px 3px 3px;
            color: white;
            text-shadow: 1px 1px 1px black;
        }
        #count_total {
            background-color: #6f98aa;
        }
        #count_successful {
            background-color: #008f00;
        }
        #count_with_errors {
            background-color: #d35ebe;
        }
        #count_failed {
            background-color: #cf0000;
        }
        #count_skipped {
            background-color: gray;
        }

        .test-tree-header {
            display: grid;
            grid-template-columns: max-content max-content max-content max-content;
            align-items: center;
        }
        .test-tree-header.hidden {
            display: none;
        }
        .test-tree-container { padding: 5px 0px 0px 22px }
        .parent-suite-header {
            padding: 3px;
            background-color: #6f98aa;
            font-weight: bold;
            color: #eFdecf;
            text-shadow: 1px 1px 1px black;
        }
        .parent-suite-container {
            background-color: #6f98aa;
            padding-bottom: 1px;
            padding-right: 5px;
            margin-bottom: 3px;
        }
        .suite-header {
            font-weight: bold;
            color: #eFdecf;
            text-shadow: 1px 1px 1px black;

        }
        .test-list-container {
            background-color: #cFbeaf;
            box-shadow: 1px 1px #284358;
            font-size: 14px;
            padding-bottom: 2px;
            margin-bottom: 5px;
            display: grid; grid-template-columns: 99%;
        }
        .test-list-container.hidden{
            display: none;
        }
        .container-menu {
            width: fit-content;
            background-color: #284358;
        }
        .menu-item {
            margin: 3px 15px;
            color: #8fb8ca;
        }
        .menu-item .label {
            cursor: pointer;
        }
        .menu-item .label:hover {
            text-decoration: underline;
        }
        .selected {
            display: grid;
            grid-template-columns: max-content auto;
            align-items: center;
        }
        .selected div {
            padding-right: 5px;
        }
        .tmsLinkBox {
            min-width: 15px;
            margin-right: 3px;
        }
        .tmsIcon {
            width: 15px;
            height: 15px;
            margin-right: 3px;
            background-position: 0 0;
            background-repeat: no-repeat;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA8AAAAPCAYAAAA71pVKAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsQAAA7EAZUrDhsAAAIFSURBVDhPbVJNaxNBGH5mdnY3UYzNSbCiRQShKUqKVqWH2t70EDz4B/wL/hd/gkcRwZsXUaTQS1VaFFGLWikGgpqYTXdnZsd33p2NEXoY5nk/nvdbXL//0glTAtZB2JIfTI0d4UrHONgF2b1eToneiV8ger2XA4FxsNd6OSWyU4hOcqktiqwIQWYq4b/CsgIzBnK2ucHcsQS31jvIhhmR7X92j/0fyDMZc40oirG+cQV371zA4lIXSZSgLPQ/Ivmy/+q9Z44FMpjsECfbbXRXutCjHOXEoqli2CzC660XyLMxlBOhZwdVEx2Venl1BdIlWFs8gSRuIUmBvAB2toYYzS/h86dt5JOMAsi6bEdEjTPnz6GhUqjC4tHT73i1OfBzwsMHX7C3M8Jx1cTVixtopXNwxnDZNO0qcyOmNBMqpyiRIkIiJBmBppSIraAENP1xjvnWAm2C+qekvGdJGQZfD5CKGNIQSQOyFBARJRjSLP5Y0kkkVmE8+glpwUPjsiUN4Ve/jw9v3kJTdFD/g/0xWm3gRu8UrvVOI/+d4+DHR3zrv0dEPfPu13pP+Dx9EL8Op6kfkv2BdC4toLN8Fnu7+9h+/g6pUjSsiH2Zc/P2Y1pV2F0IUmEHc6hR0lNCIKbeebfBPp32UUT/x1Kgkaojif6s+cKmRK9kHJ7H9V37n+WKKEyJvyZckPG4s6vEAAAAAElFTkSuQmCC');
        }
        #container_run{
            display: grid;
            grid-template-columns: repeat(3,max-content);
            align-items: center;
        }
        #container_run div {
            padding: 10px;
        }
        #container_tag_list {
            grid-row: span 8;
        }
    </style>
    <title>Отчёт</title>
</head>

<body>
<div id="container_main">
    <div id="container_menu_main">
        <div class="menu-item">
            <div class="label">ТЕСТЫ</div>
            <div class="container-menu">
                <div class="menu-item"><div class="label" view="filter">Фильтр</div></div>
                <div class="menu-item"><div class="label" view="run">Запуск</div></div>
            </div>
        </div>
    </div>
    <div id="container_content">
        <div id="container_tests"></div>
    </div>
</div>

<script type="text/javascript">
    const pipelineUrl = '';
    const authorization = 'Basic ${jenkinsAuth}';
    const stands = ${stands};
    const currentStand = '${currentStand}';
    const branches = '${branches}'.replaceAll(' ','').split(',');
    const defaultBranch = '${defaultBranch}';
    const scenarioData = ${scenarioData};
    const filterOptionsValues = {"Все": true};
    let checkStatusTimeout;
    let getLogTimeout;
    let testsStarted = false;

    function createTree(parentContainer, data){
        for (let name in data){
            const content = data[name];
            const containers = createContainers(parentContainer, name);
            containers.header.querySelector("input").value = name;
            if (Object.keys(content).length > 0){
                createTree(containers.container, content);
            }
        }
    }
    const generator = {
        filter: function(label, view){
            const options = {
                "Все": {
                    "Успешные": {},
                    "Неуспешные": {
                        "Проваленные": {
                            "С прогнозируемой ошибкой": {},
                            "С необработанным исключением": {}},
                        "Пропущенные" : {}},
                        "Добавленные в TestIT": {},
                        "Отсутствующие в TestIT": {}}

                // "Содержат в названии": {"<textarea name='name_contains'></textarea>": {}},
                // "Не содержат в названии": {"<textarea name='name_not_contains'></textarea>": {}}
            };
            view.innerHTML = "<h3>Настройки фильтра</h3>";
            createTree(view, options);
            const checkboxes = view.querySelectorAll("input");
            for (let checkbox of checkboxes){
                if (filterOptionsValues[checkbox.value]){
                    checkbox.click();
                }
                if (checkbox.value.includes("textarea")){
                    hide(checkbox);
                }
            }
            const apply = document.createElement("button");
            apply.innerHTML = "Применить";
            view.appendChild(apply);
            apply.onclick = filterApply.bind(apply, label, null);
        },
        run: function(label, view){
            view.innerHTML = "<div>Тестовый стенд</div><div><select id='testStand'></select></div>"
                           + "<div id='container_tag_list'>Теги тестов:<br><textarea id='tag_list' rows=20></textarea></div>"
                           + "<div>Тег стенда</div><div><input id='stand_tag'></div>"
                           + "<div>Ветка фреймворка</div><div><select id='framework_branch'></select></div>"
                           + "<div>Ветка автотестов</div><div><select id='autotestBranch'></select></div>"
                           + "<div>Очистить историю</div><div><input name='mavenGoal' id='maven_goal' type='radio' value='clean test'> Да <br><input name='mavenGoal' type='radio' value='test' checked> Нет</div>"
                           + "<div>Отслеживать зависимости</div><div><input name='trackDependencies' type='radio' value='true' checked> Да <br><input name='trackDependencies' type='radio' value='false'> Нет</div>"
                           + "<div>Отправить email</div><div><input name='sendEmail' type='radio' value='true'> Да <br><input name='sendEmail' type='radio' value='false' checked> Нет</div>"
                           + "<div>Автотесты в TestIT</div><div><input name='testItAction' type='radio' value='none' checked> Без изменений<br><input name='testItAction' type='radio' value='create'> Создать<br><input name='testItAction' type='radio' value='update'> Обновить</div>"
                           + "<div><button id='buttonRun'>Запустить</button></div><div id='buildInfo'></div><div><textarea id='testRunLog' cols=150 rows=20 class='hidden'></textarea></div>"
                           + "<iframe name='iframe' class='hidden'></iframe>";
            for (let stand of stands){
                let selected = stand === currentStand;
                let option = new Option(stand, stand, selected, selected);
                testStand.add(option);
            }
            for (let branch of branches){
                let selected = branch === defaultBranch;
                let option = new Option(branch, branch, selected, selected);
                autotestBranch.add(option);
            }
            const scenarioTreeContainer = document.getElementById("scenarioTreeContainer");
            const checkbox = scenarioTreeContainer.querySelector("input");
            const tags = getSelectedTags(checkbox);
            const tagList = checkbox.checked && !tags.hasHidden ? [checkbox.value] : tags.tagList;
            const textarea = document.getElementById("tag_list");
            textarea.innerHTML = tagList.join("\n");
<!--            startForm.action = pipelineUrl + '/start';-->
            checkTestRunStatus();
            buttonRun.onclick = startNewTestRun;

        }
    }
    function checkTestRunStatus(){
        if (!document.getElementById('buildInfo')){
            clearTimeout(checkStatusTimeout);
            return;
        }
        fetch(pipelineUrl + '/start/status', {
            method: 'GET',
            mode: 'cors'
        }).then(response => {
            if (response.status == 200){
                return response.json();
            } else {
                alert('Запрос статуса вернул ошибку ' + response.status);
            }
        }).then(status => {
            if (status == true){
                buildInfo.innerHTML = 'Автотесты выполняются';
                addClass(buildInfo, 'started');
                buttonRun.innerHTML = 'Остановить';
                buttonRun.disabled = false;
                buttonRun.onclick = cancelTests;
                testsStarted = true;
                if (isHidden(testRunLog)) {
                    show(testRunLog);
                    getLog(0);
                }
            } else if (testsStarted){
                buildInfo.innerHTML = 'Автотесты завершены';
                removeClass(buildInfo, 'started');
                buttonRun.innerHTML = 'Запустить';
                buttonRun.onclick = startNewTestRun;
            }
            checkStatusTimeout = setTimeout(checkTestRunStatus, 7000);
        });
    }

    function getSelectedTags(checkbox){
        const tags = {hasHidden: false, tagList: []};
        const header = checkbox.parentNode.parentNode;
        if (!header.className.includes('hidden')){
            const container = header.nextSibling;
            if (container && container.className.includes("test-tree-container") && container.querySelector("input")){
                const childCheckbox = container.querySelector("input");
                const childTags = getSelectedTags(childCheckbox);
                if (childTags.hasHidden) tags.hasHidden = true;
                if (childTags.hasHidden || !checkbox.checked){
                    tags.tagList = tags.tagList.concat(childTags.tagList);
                } else {
                    tags.tagList.push(checkbox.value);
                }
            } else {
                if (checkbox.checked){
                    tags.tagList.push(checkbox.value);
                }
            }
        } else {
            tags.hasHidden = true;
        }
        const container = header.nextSibling;
        let nextHeader = null;
        if (container){
            if (container.className.includes("test-tree-header")){
                nextHeader = container;
            } else {
                nextHeader = container.nextSibling;
            }
            if (nextHeader && nextHeader.className.includes("test-tree-header")){
                const nextCheckbox = nextHeader.querySelector("input");
                const nextTags = getSelectedTags(nextCheckbox);
                if (nextTags.hasHidden) tags.hasHidden = true;
                tags.tagList = tags.tagList.concat(nextTags.tagList);
            }
        }
        return tags;
    }
    const labels = document.querySelectorAll('.label');
    for(let label of labels){
        label.onclick = toggleMenu;
    }
    function filterApply(label, target){
        const header = target || this.parentNode.querySelector(".test-tree-header");
        const checkbox = header.querySelector("input");
        if (!checkbox) return;
        if (checkbox.checked){
            filterOptionsValues[checkbox.value] = true;
        } else {
            delete filterOptionsValues[checkbox.value];
            const childHeader = header.nextSibling ? header.nextSibling.querySelector(".test-tree-header") : null;
            if (childHeader){
                filterApply(label,childHeader);
            }

        }
        const nextHeader = header.nextSibling ? header.nextSibling.nextSibling : null;
        if (nextHeader){
            if (nextHeader.tagName.toLowerCase() !== "button"){
                filterApply(label, nextHeader);
            } else {
                label.click();
                const statuses = {
                    passed: "Все" in filterOptionsValues || "Успешные" in filterOptionsValues,
                    successful: "Все" in filterOptionsValues || "Успешные" in filterOptionsValues,
                    failed: "Все" in filterOptionsValues
                            || "Неуспешные" in filterOptionsValues
                            || "Проваленные" in filterOptionsValues
                            || "С прогнозируемой ошибкой" in filterOptionsValues,
                    broken: "Все" in filterOptionsValues
                            || "Неуспешные" in filterOptionsValues
                            || "Проваленные" in filterOptionsValues
                            || "С необработанным исключением" in filterOptionsValues,
                    skipped: "Все" in filterOptionsValues
                            || "Неуспешные" in filterOptionsValues
                            || "Пропущенные" in filterOptionsValues

                }
                const containerTests = document.getElementById("container_tests");
                const expanders = containerTests.querySelectorAll(".expander");
                for (const expander of expanders){
                    const child = expander.firstElementChild;
                    const header = expander.parentNode;
                    if (header.className.includes("test-counters")) continue
                    const container = header.nextSibling;
                    const tmsLink = header.querySelector(".tmsIcon");
                    const displayAdded = tmsLink != null && "Добавленные в TestIT" in filterOptionsValues;
                    const displayAbsent = !tmsLink && "Отсутствующие в TestIT" in filterOptionsValues;
                    for (const status in statuses){
                        if (child.className.includes(status)){
                            let change = statuses[status] && (displayAdded || displayAbsent) ? show : hide;
                            change(header);
                            if (container && container.className.includes("test-tree-container")){
                                change(container);
                            }
                        }
                    }
                }
                checkEmpty(document.getElementById("scenarioTreeContainer"));
            }
        }
    }
    function checkEmpty(container){
        const children = container.childNodes;
        let displayed = 0;
        for (const container of children){
            if (!container.className.includes('test-tree-header')) continue;
            const nextContainer = container.nextSibling;
            if (nextContainer && nextContainer.className.includes('test-tree-container') && nextContainer.firstChild.className != 'error'){
                show(container);
                show(nextContainer);
                if (checkEmpty(nextContainer)){
                    hide(container);
                    hide(nextContainer);
                }
            }
            if (!isHidden(container)){
                displayed++;
            }
        }
        return displayed == 0;
    }
    function toggleMenu(){
        const label = this;
        const viewName = label.getAttribute("view");
        const id = "container_" + viewName;
        const containerTests = document.getElementById("container_tests");
        const containerContent = document.getElementById("container_content");
        if (label.className.includes("active")){
            document.getElementById(id).remove();
            show(containerTests);
            removeClass(label, "active");
        } else {
            hide(containerTests);
            const labels = container_menu_main.querySelectorAll(".label");
            const labelsView = {};
            for (let l of labels){
                labelsView[l.getAttribute("view")] = l;
            }
            for (let viewName in generator){
                let old = document.getElementById("container_" + viewName);
                if (old) containerContent.removeChild(old);
                removeClass(labelsView[viewName], "active");
            }
            addClass(label, "active");
            const view = document.createElement("div");
            view.id = id;
            containerContent.appendChild(view);
            generator[viewName](label, view);
        }
    }
    function getParentNode(e, c){
        let p = e.parentNode;
        while (!p.className.includes(c)){
            p = getParentNode(p, c);
        }
        return p;
    }
    function show(e){
        removeClass(e, 'hidden');
    }
    function hide(e){
        show(e);
        addClass(e, 'hidden');
    }
    function replaceClass(e, c, n){
        e.className = e.className.replace(c, n);
    }
    function addClass(e, c){
        if (e.className.split(' ').indexOf(c) < 0){
            e.className+= ' ' + c;
        }
    }
    function removeClass(e, c){
        if (e.className){
            e.className = e.className.replace(c,'').trim();
        }
    }
    function filterOptions(){
        const filter = this;
        if (filter.getAttribute('open') == 'true'){
            filter.setAttribute('open', false);
            hide(menu_tests_filter);
        } else {
            filter.setAttribute('open', true);
            show(menu_tests_filter);
        }
    }

    function changeState(toggle, state){
        const header = toggle.parentNode.parentNode;
        const container = header.nextSibling;
        if (!container || !container.className.startsWith("test-tree-container")){
            return;
        }
        var expanders = container.getElementsByClassName('expander');
        for (let expander of expanders){
            changeState(expander.firstElementChild, state);
        }
        if (state === 'shrink'){
            if (toggle.id !== "toggleAllButton" && !container.className.includes('hidden')){
                hide(container);
            }
            replaceClass(toggle, 'shrink', 'expand');
        } else if (state === 'expand') {
            show(container);
            replaceClass(toggle, 'expand', 'shrink');
        }
    }
    function changeContainerState(){
        const expectedStatus = this.className.includes("shrink") ? "shrink" : "expand";
        changeState(this, expectedStatus);
    }
    function isHidden(el){ return (el.offsetParent === null) }
    function checkAll(){
        const container = this.parentNode.parentNode.nextSibling;
        if (container && container.className.includes('test-tree-container')){
            let checkboxes = container.getElementsByTagName('input');
            for (let checkbox of checkboxes){
                checkbox.checked = this.checked;
            }
        }
        const header = this.parentNode.parentNode;
        if (!header.className.includes('test-counters') && !this.checked && header.parentNode.id !== 'container_filter'){
            uncheckParent(header.parentNode.previousSibling);
        }
    }
    function uncheckParent(header) {
        header.querySelector('input').checked = false;
        const previousHeader = header.parentNode ? header.parentNode.previousSibling : null;
        if (previousHeader && previousHeader.tagName && previousHeader.tagName.toLowerCase() === "div"){
            uncheckParent(previousHeader);
        }
    }
    function createContainers(parentContainer, headerContent, tmsUrl){
        const header = document.createElement('div');
        header.className = "test-tree-header";
        parentContainer.appendChild(header);
        const container = document.createElement('div');
        container.className = "test-tree-container";
        parentContainer.appendChild(container);

        let expand = document.createElement('div');
        header.appendChild(expand);
        expand.className = "expander";
        expand.innerHTML = " ";
        let triangle = document.createElement('div');
        triangle.className = 'toggle shrink';
        expand.appendChild(triangle);
        let checkboxContainer = document.createElement('div');
        header.appendChild(checkboxContainer);
        let checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkboxContainer.appendChild(checkbox);
        checkbox.onchange = checkAll;
        if (tmsUrl){
            let tmsLink = document.createElement('a');
            tmsLink.className = "tmsIcon";
            tmsLink.href = tmsUrl;
            tmsLink.target = '_blank';
            header.appendChild(tmsLink);
        } else if (parentContainer.className.includes("test-list")){
            let tmsLinkBox = document.createElement('div');
            tmsLinkBox.className = "tmsLinkBox";
            header.appendChild(tmsLinkBox);
        }
        let headerText = document.createElement('div');
        header.appendChild(headerText);
        headerText.innerHTML = headerContent;
        return {header: header, container: container};
    }
    function checkBuildStatus(callback, lastBuildId){
        fetch(pipelineUrl + '/start/check', {
            method: 'GET',
            headers: {
                'Authorization': authorization
            }
        }).then(response => {
            if (response.status == 200){
                return response.json();
            } else {
                alert('Запрос статуса вернул ошибку ' + response.status);
            }
        }).then(data => {
            callback(data, lastBuildId);
        });
    }
    function startTests(){
        if (testsStarted) return;
        testsStarted = true;
        submit.disabled = true;
        const tagList = document.getElementById('tag_list').value.replaceAll('\n',',');
        mavenGoal.value = maven_goal.value;
        standName.value = test_stand.value;
        tags.value = tagList;
        let actions = document.getElementsByName('mavenGoal');
        for (let action of actions){
            if (action.checked){
                mavenGoal.value = action.value;
                break;
            }
        }
        testsStarted = true;
        show(testRunLog);
        getLog(0);
        if (startForm) {
            startForm.submit();
        }
    }

    function getLog(lastIndex){
        if (lastIndex < 0) {
            clearTimeout(getLogTimeout);
            return;
        } else if (lastIndex == 0){
            testRunLog.innerHTML = '';
        }
        fetch(pipelineUrl + '/start/getLog/' + lastIndex, {
            method: 'GET',
            mode: 'cors'
        }).then(response => {
            if (response.status == 200){
                return response.json();
            } else {
                alert('Запрос статуса вернул ошибку ' + response.status);
            }
        }).then(data => {
            if (!document.getElementById('testRunLog')) return;
            const scrolledDown =  Math.abs(testRunLog.scrollHeight - testRunLog.clientHeight - testRunLog.scrollTop) <= 1;
            for (let index in data){
                testRunLog.innerHTML += data[index] + '\n';
            }
            if (scrolledDown) {
                testRunLog.scrollTop = testRunLog.scrollHeight;
            }
            getLogTimeout = setTimeout(getLog, 3000, lastIndex + data.length);
        });
    }

    function cancelTests(){
        buildInfo.innerHTML = 'Отправлен запрос на отмену запуска тестов';
        fetch(pipelineUrl + '/start/cancel', {
            method: 'GET',
            mode: 'cors'
        }).then(response => {
            if (response.status == 200){
                return response.json();
            } else {
                alert('Запрос статуса вернул ошибку ' + response.status);
            }
        }).then(status => {
            if (status == false){
                buildInfo.innerHTML = 'Процесс запуска остановлен';
                buttonRun.innerHTML = 'Запустить';
                buttonRun.onclick = startNewTestRun;
                getLog(-1);
            }
        });
    }

    function startNewTestRun(){
        buttonRun.disabled = true;
        buildInfo.innerHTML = 'Подготовка данных для запуска автотестов';
        let formData = {};
        formData.standName = testStand.value;
        formData.tags = document.getElementById('tag_list').value.replaceAll('\n',',');
        for (let label of ['mavenGoal', 'trackDependencies', 'sendEmail', 'testItAction']){
            let actions = document.getElementsByName(label);
            for (let action of actions){
                if (action.checked){
                    formData[label] = action.value;
                    break;
                }
            }
        }
        fetch(pipelineUrl + '/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                mode: 'cors'
            },
            body: JSON.stringify(formData)
        }).then(response => {
            testsStarted = true;
            show(testRunLog);
            getLog(0);
        });
        buildInfo.innerHTML = 'Отправлен запрос на запуск автотестов';

    }

    function startNewBuild(lastBuildId, tagList, stand, branch, ){
        let scenarioTags = tagList.join(',');
        let formData = new FormData();
        formData.append('standName', stand);
        formData.append('branch', branch);
        formData.append('scenarioTags', scenarioTags);
        for (let label of ['mavenGoal', 'trackDependencies', 'sendEmail', 'testItAction']){
            let actions = document.getElementsByName(label);
            for (let action of actions){
                if (action.checked){
                    formData.append(label, action.value);
                    break;
                }
            }
        }
        let parameters = []
        for (const pair of formData.entries()) {
            parameters.push(pair.join('='));
        }
        let fetchBody = parameters.join('&');
        fetch(pipelineUrl + '/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': authorization
            },
            body: fetchBody
        }).then(response => {
            switch (response.status) {
                case 201:
                    let buildLink = document.getElementById('buildLink');
                    const buildInfo = document.getElementById('buildInfo');
                    buildLink && buildLink.remove();
                    let currentStatus = document.createElement('span');
                    currentStatus.innerText = 'Запрос отправлен. Ожидается запуск тестов...';
                    buildInfo.appendChild(currentStatus);
                    let waitNewBuild = (lastBuildId) => {
                        checkBuildStatus((data, lastBuildId) => {
                            if (lastBuildId == data.id){
                                waitNewBuild(lastBuildId);
                                return;
                            }
                            currentStatus.remove();
                            let link = document.createElement('a');
                            link.id = 'buildLink';
                            buildInfo.appendChild(link);
                            link.href = data.url;
                            link.innerHTML = data.fullDisplayName;
                            link.target = '_blank';
                        }, lastBuildId);
                    }
                    waitNewBuild(lastBuildId);
                    break;
                default:
                    console.error('Запрос на запуск автотестов вернул ошибку с кодом ' + response.status);
                    alert('Запрос на запуск автотестов вернул ошибку с кодом ' + response.status)
            }
        });
    }
    if (!branches.includes(defaultBranch)){
        branches.push(defaultBranch);
    }
    const counters = 'Всего: <span id="count_total"> </span>'
                   + 'Успешных: <span id="count_successful"> </span>'
                   + 'С некритическими ошибками: <span id="count_with_errors"> </span>'
                   + 'Проваленных: <span id="count_failed"> </span>'
                   + 'Пропущенных: <span id="count_skipped"> </span>';
    const containerTests = document.getElementById("container_tests");
    const containers = createContainers(containerTests, counters);
    const treeHeader = containers.header;
    addClass(treeHeader, 'test-counters');
    const treeContainer = containers.container;
    treeContainer.id = 'scenarioTreeContainer';
    treeContainer.style.top = treeHeader.offsetTop + treeHeader.offsetHeight + 5 + 'px';
    treeContainer.style.bottom = '2px';
    treeContainer.style.left = treeContainer.offsetLeft + 'px';
    treeContainer.style.right = '2px';
    const countersValues = {total: 0, successful: 0, withErroros: 0, failed: 0, skipped: 0};

    let toggleAllButton = container_content.getElementsByClassName('shrink')[0];
    toggleAllButton.id = "toggleAllButton";
    let parentSuiteNames = Object.keys(scenarioData);
    parentSuiteNames.sort();
    let countParentSuiteUnsuccessful = 0;
    for (let parentSuiteName of parentSuiteNames){
        let parentSuiteContainer = createContainers(containers.container, parentSuiteName);
        addClass(parentSuiteContainer.header, 'parent-suite-header');
        addClass(parentSuiteContainer.container, 'parent-suite-container');
        let testSuiteResults = scenarioData[parentSuiteName].testSuiteResults;
        var checkbox = parentSuiteContainer.header.querySelector("input");
        let parentSuiteTag = '@' + parentSuiteName.split('.')[0];
        checkbox.value = parentSuiteTag;
        let suiteNames = Object.keys(testSuiteResults);
        suiteNames.sort();
        let countSuiteUnsuccessful = 0;
        for (let suiteName of suiteNames){
            let suiteContainer;
            let suiteTag = parentSuiteTag;
            if (suiteName !== '-'){
                suiteTag = suiteName.split('.')[0];
                suiteContainer = createContainers(parentSuiteContainer.container, suiteName)
                addClass(suiteContainer.header, 'suite-header');
                checkbox = suiteContainer.header.querySelector("input");
                suiteTag = parentSuiteTag + '.' + suiteName.split('.')[0];
                checkbox.value = suiteTag;
            } else {
                suiteContainer = parentSuiteContainer;
            }
            let subSuiteResults = testSuiteResults[suiteName].testSubSuiteResults;
            let subSuiteNames = Object.keys(subSuiteResults);
            subSuiteNames.sort();
            let countSubSuiteUnsuccessful = 0;
            let subSuiteTag = suiteTag;
            for (let subSuiteName of subSuiteNames){
                let subSuiteContainer;
                if (subSuiteName !== '-'){
                    subSuiteTag = subSuiteName.split('.')[0];
                    subSuiteContainer = createContainers(suiteContainer.container, subSuiteName);
                    addClass(subSuiteContainer.header, 'suite-header');
                    checkbox = subSuiteContainer.header.querySelector("input");
                    subSuiteTag = suiteTag + '.' + subSuiteName.split('.')[0];
                    checkbox.value = subSuiteTag;
                } else {
                    subSuiteContainer = suiteContainer;
                }
                let testResults = subSuiteResults[subSuiteName].testResults;
                let scenarioNames = Object.keys(testResults);
                scenarioNames.sort();
                addClass(subSuiteContainer.container, 'test-list-container');
                let countTestUnsuccessful = 0;
                for (let scenarioName of scenarioNames){
                    countersValues.total++;
                    let tmsUrl = testResults[scenarioName].autotestId ? testResults[scenarioName].tmsLink : null;
                    let scenarioTag = scenarioName.split('.')[0];
                    let scenarioNameContainer = createContainers(subSuiteContainer.container, scenarioName, !tmsUrl || tmsUrl === "#" ? null : tmsUrl);
                    let expand = scenarioNameContainer.header.getElementsByClassName('shrink')[0];
                    let status = testResults[scenarioName].status ? testResults[scenarioName].status.toLowerCase() : null;
                    if (status === "passed"){
                        countersValues.successful++;
                        expand.className = status;
                        expand.innerHTML = "&starf;";
                        subSuiteContainer.container.removeChild(scenarioNameContainer.container);
                    } else if (!status || status === "skipped"){
                        countersValues.skipped++;
                        expand.className = status || "skipped";
                        expand.innerHTML = "&times;";
                        subSuiteContainer.container.removeChild(scenarioNameContainer.container);
                        countTestUnsuccessful++;
                    } else {
                        if (status === "unknown"){
                            countersValues.withErroros++;
                        } else {
                            countersValues.failed++;
                        }
                        expand.className+= ' ' + status;
                        countTestUnsuccessful++;
                    }
                    checkbox = scenarioNameContainer.header.querySelector("input");
                    let testTag = subSuiteTag + '.' + scenarioName.split('.')[0];
                    checkbox.value = testTag;
                    let errorMessage = testResults[scenarioName].errorMessage;
                    if (errorMessage){
                        let errorContainer = document.createElement('div');
                        errorContainer.className = 'error';
                        errorContainer.innerHTML = errorMessage;
                        scenarioNameContainer.container.appendChild(errorContainer);
                    }
                }
                let subSuiteStatus;
                if (countTestUnsuccessful == 0){
                    subSuiteStatus = ' successful';
                } else {
                    subSuiteStatus = ' warning';
                    countSubSuiteUnsuccessful++;
                }
                subSuiteContainer.header.querySelector('div.shrink').className+= subSuiteStatus;
            }
            let suiteStatus;
            if (countSubSuiteUnsuccessful == 0){
                suiteStatus = ' successful';
            } else {
                suiteStatus = ' warning';
                countSuiteUnsuccessful++;
            }
            suiteContainer.header.querySelector('div.shrink').className+= suiteStatus;
        }
        let parentSuiteStatus;
        if (countSuiteUnsuccessful == 0){
            parentSuiteStatus = ' successful';
        } else {
            parentSuiteStatus = ' warning';
            countParentSuiteUnsuccessful++;
        }
        parentSuiteContainer.header.querySelector('div.shrink').className+= parentSuiteStatus;
    }
    addClass(toggleAllButton, countParentSuiteUnsuccessful == 0 ? 'successful' :'warning');

    count_total.innerHTML = countersValues.total;
    count_successful.innerHTML = countersValues.successful;
    count_with_errors.innerHTML = countersValues.withErroros;
    count_failed.innerHTML = countersValues.failed;
    count_skipped.innerHTML = countersValues.skipped;

    var toggleButtons = document.getElementsByClassName('toggle');
    for (let button of toggleButtons){
        button.onclick = changeContainerState;
    }
    container_content.style.left = container_menu_main.offsetWidth + "px";

</script>
