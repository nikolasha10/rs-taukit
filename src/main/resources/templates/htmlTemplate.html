<html>
<head>
	<meta charset="utf-8">
	<style>
		body { text-align: center; }
		table { margin: 0 auto; }
		th { font-weight: bold; text-align: center; border-bottom: 2px solid gray; }
	</style>
</head>

<body>
	<table>
		<tr>
			<th id="comparedFiles">Тест</th>
			<th>Результат сравнения:</th>

		</tr>
		<tr>
			<td><div><img id="image" src=""></div></td>
			<td><div><div></div><img id="differences" src=""></div></td>
		</tr>
	</table>
	<div></div>
	<script type="text/javascript" defer>
		var images = ["${tested}","${expected}","${differences}"];
		var labels = ["Тест","Эталон"];
		var index = 0;
		image.src = images[index];
		differences.src = images[2];
		image.onclick = function(){
			index = 1 - index;
			this.src = images[index];
			comparedFiles.innerText = labels[index];
		}
	</script>
</body>
</html>
