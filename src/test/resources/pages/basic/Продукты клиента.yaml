Адрес: /efr/clientProducts?clientId=%s&systemId=%s
Обязательная часть адреса: /efr/clientProducts
Название: Продукты клиента
Элементы:
  ФИО клиента:
    тип: текст
    xpath: //div[@title='ФИО']
  Активная вкладка:
    тип: текст
    xpath: //div[@class='clients-tab']//li[@class='active-tab']//span[text()='Продукты']
  Карты:
    тип: контейнер
    test-id: collapseCards
    элементы:
      Карточные счета:
        тип: список
        xpath: //div[@class='card-account-wrapper card-account-title-main']/..
        элементы:
          Номер счета:
            тип: ссылка
            xpath: //div[@class='card-account-link']//a//span
          Карты:
            тип: список
            xpath: //div[@class='product-template-type card-distance']
            элементы:
              Номер карты:
                тип: текст
                xpath: //div[@class='product-text-main-row']//span[@class='product-text'][1]
              Операции:
                тип: меню
                xpath: //div[@class='product-template-actions-item']
Обязательные элементы:
  - Активная вкладка
Общие блоки элементов:
  - Главное меню
  - Меню вкладок страницы 'Клиенты'
Максимальное время ожидания: по умолчанию