Адрес:
Обязательная часть адреса: mainProcessKey=ClientCreateProcess
Название: Создание клиента
Элементы:
  Полная идентификация:
    тип: кнопка
    test-id: client-data-full-identification
  Упрощенная идентификация:
    тип: кнопка
    test-id: client-data-simple-identification
  Общие сведения:
    тип: контейнер
    xpath: //div[text()='Общие сведения']/..
    элементы:
      Аватар:
        тип: файл
        test-id: client-avatar-download
      Фамилия:
        тип: поле
        test-id: field-group-clientData-field-name-surName
      Имя:
        тип: поле
        test-id: field-group-clientData-field-name-firstName
      Отчество:
        тип: поле
        test-id: field-group-clientData-field-name-middleName
      Фамилия и Имя на латинице:
        тип: поле
        test-id: otherInformation-field-latinName
      Дата рождения:
        тип: поле
        test-id: field-group-generalInformation-field-name-birthDate-input
      Пол:
        тип: радио-кнопка
        xpath: //span[text()='Пол']/following::div[@class='field-value'][1]
      Гражданство:
        тип: справочник
        xpath: //span[text()='Гражданство']/ancestor::div[@class='field undefined']
        страница: Выберите страну
      Резидент:
        тип: переключатель
        xpath: //input[@data-id='client-residence-toggle']/ancestor::label
  Место рождения:
    тип: контейнер
    xpath: //div[text()='Место рождения']/..
    элементы:
      Место рождения:
        тип: поле
        test-id: field-group-client-data-field-name-birthplace
      Страна:
        тип: справочник
        xpath: //div[text()='Место рождения']/following::span[text()='Страна'][1]/ancestor::div[@class='field undefined']
        страница: Выберите страну
      Субъект РФ:
        тип: справочник
        xpath: //div[text()='Место рождения']/following::span[text()='Субъект РФ'][1]/ancestor::div[@class='field undefined']
        страница: Субъекты РФ
      Район:
        тип: поле
        test-id: birth-place-district
      Населённый пункт:
        тип: поле
        test-id: birth-place-locality
  Документы:
    тип: контейнер
    xpath: //div[text()='Документы']/..
    элементы:
      Документ:
        тип: контейнер
        xpath: //div[@class='document-block']
        элементы:
          Тип документа:
            тип: выпадающий список
            xpath: //div[contains(@data-id,'docType')]
          Удалить документ:
            тип: кнопка
            xpath: //a[contains(@data-id,'delete')]
          Серия:
            тип: поле
            xpath: //input[contains(@data-id,'docSeries')]
          Номер:
            тип: поле
            xpath: //input[contains(@data-id,'docNumber')]
          Код подразделения:
            тип: поле
            xpath: //input[contains(@data-id,'divisionCode')]
          Кем выдан:
            тип: поле
            xpath: //input[contains(@data-id,'issuedBy')]
          Дата выдачи:
            тип: дата
            xpath: //input[contains(@data-id,'issuedDate-input')]
          Дата окончания:
            тип: дата
            xpath: //input[contains(@data-id,'issuedEndDate-input')]
          Активен:
            тип: переключатель
            xpath: //input[contains(@data-id,'active')]/..
          Основной документ:
            тип: переключатель
            xpath: //input[contains(@data-id,'main')]/..
          Признак действительного документа:
            тип: переключатель
            xpath: //input[contains(@data-id,'validDocument')]/..
          Скан документа:
            тип: файл
            xpath: //input[contains(@data-id,'file-upload')]
      Добавить документ:
        тип: кнопка
        test-id: button-add-doc
      Полис ОМС:
        тип: поле
        test-id: oms
      ИНН:
        тип: поле
        test-id: field-group-documentsBlock-field-name-inn
      СНИЛС:
        тип: поле
        test-id: field-group-documentsBlock-field-name-snils
      Серия водительского удостоверения:
        тип: поле
        test-id: field-group-documentsBlock-field-name-licenseDriver
      Номер водительского удостоверения:
        тип: поле
        test-id: field-group-documentsBlock-field-name-licenseDriver
      Выдано:
        тип: дата
        xpath: licenseDriverIssuedDate-input
  Контакты:
    тип: контейнер
    xpath: //div[text()='Контакты']/..
    элементы:
      E-mail:
        тип: поле
        test-id: field-email-value
      E-mail отсутствует:
        тип: чекбокс
        xpath: //input[@data-id='field-email-empty']/..
      Телефон:
        тип: контейнер
        xpath: //span[text()='Тип телефона']/ancestor::div[@class='field undefined']/..
        элементы:
          Тип телефона:
            тип: выпадающий список
            xpath: //div[contains(@data-id,'phonetype')]
          Номер телефона:
            тип: поле
            xpath: //input[contains(@data-id,'phoneNumber')]
          Удалить:
            тип: кнопка
            xpath: //a[contains(@data-id,'delete')]
          Основной:
            тип: переключатель
            xpath: //input[contains(@data-id,'phoneMain')]
  Адреса:
    тип: контейнер
    xpath: //div[text()='Адреса']/..
    элементы:
      Адрес регистрации:
        тип: контейнер
        xpath: //div[text()='Адрес регистрации']/following-sibling::div[1]
        элементы:
          Страна:
            тип: справочник
            xpath: //span[text()='Страна']/ancestor::div[@class='field undefined']
            страница: Выберите страну
          Адрес:
            тип: поиск по значению
            xpath: //span[text()='Адрес']/following::div[@class='field-value'][1]
          Регион:
            тип: поиск по значению
            xpath: //span[text()='Регион']/following::div[@class='field-value'][1]
          Город:
            тип: поле
            xpath: //input[contains(@data-id,'field-city')]
          Улица:
            тип: поле
            xpath: //input[contains(@data-id,'field-street')]
          Номер дома:
            тип: поле
            xpath: //input[contains(@data-id,'field-house')]
          Индекс:
            тип: поле
            xpath: //input[contains(@data-id,'field-index')]
          Период регистрации (с):
            тип: поле
            xpath: //..//input[@data-id='field-registrationAddress-reg-period-start-input']
      Адрес фактического проживания:
        тип: контейнер
        xpath: //div[text()='Адрес фактического проживания']/../following-sibling::div[1]
        элементы:
          Совпадает с адресом регистрации:
            тип: чекбокс
            xpath: //preceding-sibling::div[1]//button
      Почтовый адрес:
        тип: контейнер
        xpath: //div[text()='Почтовый адрес']/../following-sibling::div[1]
        элементы:
          Совпадает с адресом регистрации:
            тип: чекбокс
            xpath: //preceding-sibling::div[1]//button[@data-id='checkbox-mailSwitcher0']
  Кодовое слово:
    тип: поле
    test-id: otherInformation-field-codeWord
  Сохранить:
    тип: кнопка
    test-id: button-save
  Отмена:
    тип: кнопка
    test-id: button-cancel

Обязательные элементы:
  - Полная идентификация
  - Упрощенная идентификация
Общие блоки элементов:
  - Главное меню
Максимальное время ожидания: по умолчанию