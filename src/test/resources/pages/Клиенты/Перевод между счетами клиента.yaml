Название: Перевод между счетами клиента
Элементы:
  Заголовок:
    тип: текст
    локатор: //div[@class='fieldset-legend' and text()='Перевод между счетами клиента']
  Счет списания:
    тип: выпадающий список
    локатор: fromResource
    элементы: //div[@role='option']
    значение: //span[@role='option' and @aria-selected='true']
Обязательные элементы:
  - Заголовок
Общие блоки элементов:
  - Главное меню
Максимальное время ожидания: по умолчанию