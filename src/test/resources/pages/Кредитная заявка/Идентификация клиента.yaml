Адрес: /efr/identification-credit-claim-page?id=%d
Обязательная часть адреса: /efr/identification-credit-claim-page
Название: Идентификация клиента
Элементы:
  Кредитные заявки:
    тип: список
    xpath: //ul[@class='left-menu-content']
  Запрашиваемые параметры кредита:
    тип: контейнер
    test-id: identification-credit-claim-form
    элементы:
      Кредитный продукт:
        тип: поле
        xpath: //span[text()='Кредитный продукт']/following::div[@class='field-value'][1]
  Данные клиента:
    тип: контейнер
    xpath: //div[@class='fieldset-container black fieldset-container-border-none field-columns-1']
    элементы:
      Телефон:
        тип: поле
        xpath: //span[text()='Телефон']/following::div[@class='field-value'][1]
  Редактирование:
    тип: кнопка
    test-id: edit-button
  Поиск клиента:
    тип: кнопка
    test-id: find-button
  Отказ:
    тип: кнопка
    test-id: refuse-button
  Возврат:
    тип: кнопка
    test-id: back-button
Обязательные элементы:
  - Кредитные заявки
  - Запрашиваемые параметры кредита
Общие блоки элементов:
  - Главное меню
Максимальное время ожидания: по умолчанию