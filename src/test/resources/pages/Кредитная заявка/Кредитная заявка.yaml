Название: Кредитная заявка
Элементы:
  Заголовок:
    тип: текст
    xpath: //div[@data-id='credit-claim-panel']/label[text()='Кредитная заявка']
  Статус:
    тип: текст
    xpath: //span[text()='Статус']/following::div[@class='field-value'][1]
  Меню вкладок страницы:
    тип: список
    xpath: //div[@class='tabs tab-additional']/ul[@class='tabs__labels']//a
  Параметры заявки:
    тип: контейнер
    xpath: //div[@class='tabs tab-primary']
    элементы:
      Меню вкладок подраздела:
        тип: список
        xpath: //ul[@class='tabs__labels']//a
      Запрошенные параметры:
        тип: контейнер
        test-id: requested-params-view-tab
        элементы:
          Ожидание клиента:
            тип: кнопка
            test-id: revert
          Подтвердить:
            тип: кнопка
            test-id: success
          Вернуть:
            тип: кнопка
            test-id: revert
      Запрошенные параметры (редактирование):
        тип: контейнер
        test-id: edit-credit-params-tab-form
        элементы:
          Сотрудник, осуществивший продажу:
            тип: выпадающий список
            test-id: select-form-field-seller
          Личное страхование Заемщика:
            тип: переключатель
            xpath: //input[@data-id='toggle-form-field-insuranceParams']/ancestor::label
          Страховая программа:
            тип: выпадающий список
            test-id: select-form-field-insuranceProgram
          Вариант страхования:
            тип: радио-кнопка
            test-id: //span[text()='Вариант страхования']/following::div[@class='field-value'][1]
          Страховая плата:
            тип: поле
            test-id: input-form-field-insuranceAmount
          За счет кредитных средств:
            тип: чекбокс
            test-id: //input[@data-id='input-form-field-dateFrom']/..
          Вознаграждения Банку:
            тип: поле
            test-id: input-form-field-bankReward
          Страховая премия страховой организации:
            тип: поле
            test-id: input-form-field-insurancePremium
          Комментарий сотрудника фронт-офиса:
            тип: поле
            test-id: text-area-form-field-employeeComment
          Продолжить:
            тип: кнопка
            test-id: success
      Решение банка:
        тип: контейнер
        xpath: //a[@class='active' and @data-id='bank-decision-credit-tab']/following::div[@class='tab-content']
        элементы:
          Отказ:
            тип: кнопка
            test-id: refuse
          Подтвердить:
            тип: кнопка
            xpath: //span[text()='Подтвердить']/..
          Вернуть:
            тип: кнопка
            test-id: revert
      Создать КОД:
        тип: кнопка
        test-id: success
  Параметры выдачи:
    тип: контейнер
    test-id: issuance-params
    элементы:
      Сумма кредита:
        тип: поле
        test-id: input-form-field-amount
      День платежа:
        тип: выпадающий список
        test-id: select-form-field-payDay
      Форма расчетов:
        тип: выпадающий список
        test-id: select-form-field-payForm
      Счет:
        тип: выпадающий список
        test-id: account
      Создание поручений на перечисление ДС в счет погашения кредитных обязательств:
        тип: переключатель
        test-id: toggle-form-field-creditPaymentOrder
      Далее:
        тип: кнопка
        test-id: next
      Оформить:
        тип: кнопка
        test-id: confirm
      Отмена:
        тип: кнопка
        test-id: revert
  Страхование:
    тип: контейнер
    test-id: Insurance-tab
    элементы:
      Оформить:
        тип: кнопка
        test-id: confirm
  Заемщик:
    тип: контейнер
    xpath: //div[@class='tabs tab-progress']
    элементы:
      Меню вкладок подраздела:
        тип: список
        xpath: //ul[@class='tabs__labels']//a
      Персональные данные:
        тип: контейнер
        test-id: personal-data
        элементы:
          Образование:
            тип: выпадающий список
            test-id: select-form-field-education
          СНИЛС:
            тип: поле
            test-id: input-form-field-snils
          Военный билет:
            тип: радио-кнопка
            xpath: //span[text()='Военный билет']/following::div[@class='field-value'][1]
          Тип жилья:
            тип: выпадающий список
            test-id: select-form-field-housingType
          Семейное положение:
            тип: выпадающий список
            test-id: select-form-field-familyStatus
          Кол-во детей до 18 лет:
            тип: поле
            test-id: input-form-field-underageChildCount
          Кол-во иных иждивенцев, за исключением детей до 18 лет:
            тип: поле
            test-id: input-form-field-dependantCount
      Работа:
        тип: контейнер
        test-id: job-data
        элементы:
          Информация о трудоустройстве:
            тип: выпадающий список
            test-id: select-form-field-employment
          Наличие трудовой книжки:
            тип: радио-кнопка
            xpath: //span[text()='Наличие трудовой книжки']/following::div[@class='field-value'][1]
          Платёжеспособность:
            тип: радио-кнопка
            xpath: //span[text()='Платёжеспособность']/following::div[@class='field-value'][1]
          Общий стаж за последние 5 лет:
            тип: контейнер
            xpath: //span[text()='Общий стаж за последние 5 лет']/following::div[@class='field-value'][1]
            элементы:
              лет:
                тип: поле
                test-id: input-form-field-fiveYearsExperience-years
              мес.:
                тип: поле
                test-id: input-form-field-fiveYearsExperience-months
      Доходы и расходы:
        тип: контейнер
        test-id: incomes-expenses-data
        элементы:
          Доходы:
            тип: контейнер
            xpath: //div[text()='Доходы']/following::div[@class='fieldset-content'][1]
            элементы:
              Способ подтверждения дохода по основному месту работы:
                тип: выпадающий список
                test-id: confirm-docmainIncomeConfirmDocument
              Основная зарплата:
                тип: поле
                xpath: //span[text()='Основная зарплата']/following::input[1]
              Способ подтверждения дополнительного дохода:
                тип: выпадающий список
                test-id: confirm-docadditionalIncomeConfirmDocument
              Доход по совместительству:
                тип: поле
                xpath: //span[text()='Доход по совместительству']/following::input[1]
              Способ подтверждения пенсионных доходов:
                тип: выпадающий список
                test-id: confirm-docpensionIncomeConfirmDocument
              Пенсия:
                тип: поле
                test-id: input-form-field-pension
              Способ подтверждения иных доходов:
                тип: выпадающий список
                test-id: confirm-docotherIncomeConfirmDocument
              Иные доходы:
                тип: поле
                test-id: input-form-field-otherIncome
          Расходы:
            тип: контейнер
            xpath: //div[text()='Расходы']/following::div[@class='fieldset-content'][1]
            элементы:
              Обязательные выплаты:
                тип: поле
                test-id: input-form-field-requiredPayments
              Алименты:
                тип: поле
                test-id: input-form-field-alimony
      Иная информация:
        тип: контейнер
        test-id: other-info
        элементы:
          Отношение к воинской службе:
            тип: выпадающий список
            test-id: select-form-field-militaryServiceRelation
      Продолжить:
        тип: кнопка
        test-id: continue
      Сохранить:
        тип: кнопка
        test-id: save
      Отказ:
        тип: кнопка
        test-id: refuse
  Документы:
    тип: контейнер
    test-id: credit-document-id
    элементы:
      Документы:
        тип: таблица
        xpath: //table
      Добавить:
        тип: кнопка
        test-id: add-doc-id
      Печать анкеты заявления (односторонняя):
        тип: загрузка файла
        test-id: print-
      Печать анкеты заявления (двусторонняя):
        тип: загрузка файла
        test-id: print-twoSided
      Продолжить:
        тип: кнопка
        test-id: success
  Верификация:
    тип: контейнер
    test-id: bio-verification-form
    элементы:
      Данные заемщика:
        тип: таблица
        xpath: //table
        элементы:
          Строки:
            элементы:
              Верифицировать:
                тип: кнопка
                xpath: //a[span[text()='Верифицировать']]
      Продолжить:
        тип: кнопка
        test-id: next
      Отказ:
        тип: кнопка
        test-id: refuse
  Визуальная оценка:
    тип: контейнер
    test-id: visual-assessment-credit-tab-form
    элементы:
      У клиента имеются признаки алкогольного/наркотического опьянения?:
        тип: радио-кнопка
        xpath: //span[text()='У клиента имеются признаки алкогольного/наркотического опьянения?']/following::div[@class='field-value'][1]
      У клиента наблюдаются явные отклонения в психическом состоянии?:
        тип: радио-кнопка
        xpath: //span[text()='У клиента наблюдаются явные отклонения в психическом состоянии?']/following::div[@class='field-value'][1]
      У клиента имеются видимые отклонения в физическом состоянии?:
        тип: радио-кнопка
        xpath: //span[text()='У клиента имеются видимые отклонения в физическом состоянии?']/following::div[@class='field-value'][1]
      У клиента имеются признаки судимости?:
        тип: радио-кнопка
        xpath: //span[text()='У клиента имеются признаки судимости?']/following::div[@class='field-value'][1]
      Ведет ли клиент себя неадекватно?:
        тип: радио-кнопка
        xpath: //span[text()='Ведет ли клиент себя неадекватно?']/following::div[@class='field-value'][1]
      Выглядит ли клиент неопрятно?:
        тип: радио-кнопка
        xpath: //span[text()='Выглядит ли клиент неопрятно?']/following::div[@class='field-value'][1]
      Клиента сопровождают?:
        тип: радио-кнопка
        xpath: //span[text()='Клиента сопровождают?']/following::div[@class='field-value'][1]
      Продолжить:
        тип: кнопка
        test-id: continue
      Отказ:
        тип: кнопка
        test-id: refuse
  История:
    тип: контейнер
    test-id: history-credit-view
    элементы:
      История:
        тип: таблица
        xpath: //table
  Проверка сведений о доходах:
    тип: контейнер
    test-id: income-verification-view
    элементы:
      Основной доход:
        тип: контейнер
        xpath: //div[text()='Основной доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            xpath: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
      Пенсионный доход:
        тип: контейнер
        xpath: //div[text()='Пенсионный доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            xpath: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
      Дополнительный доход:
        тип: контейнер
        xpath: //div[text()='Дополнительный доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            xpath: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
      Иные доходы:
        тип: контейнер
        xpath: //div[text()='Иные доходы']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            xpath: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
      Продолжить:
        тип: радио-кнопка
        test-id: next
      Отказ:
        тип: радио-кнопка
        test-id: refuse
      Вернуть:
        тип: радио-кнопка
        test-id: cancel
  Продолжить:
    тип: кнопка
    test-id: success
  Идентифицировать клиента:
    тип: радио-кнопка
    test-id: identification
  Задать параметры выдачи:
    тип: кнопка
    test-id: success
  Печать КОД:
    тип: кнопка
    test-id: print-cod
  Отказ:
    тип: кнопка
    test-id: refuse
Обязательные элементы:
 - Заголовок
Общие блоки элементов:
 - Главное меню
Максимальное время ожидания: по умолчанию