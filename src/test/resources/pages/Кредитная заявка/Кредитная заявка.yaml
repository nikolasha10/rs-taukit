Название: Кредитная заявка
Элементы:
  Заголовок: //div[@data-id='credit-claim-panel']/label[text()='Кредитная заявка']
  Статус: //span[text()='Статус']/following::div[@class='field-value'][1]
  Меню вкладок страницы:
    Тип: список
    Локатор: //div[@class='tabs tab-additional']/ul[@class='tabs__labels']
    Названия: //span[@class='tabs-name']
    Кнопки: //parent::a
  Параметры заявки:
    тип: блок элементов
    локатор: //div[@class='tabs tab-primary']
    элементы:
      Меню вкладок подраздела:
        тип: список
        локатор: //ul[@class='tabs__labels']
        названия: //span[@class='tabs-name']
        Кнопки: //parent::a
      Запрошенные параметры:
        тип: блок элементов
        локатор: requested-params-view-tab
        элементы:
          Продолжить: success
          Ожидание клиента: revert
          Задать параметры выдачи: success
          Печать КОД: print-cod
          Отказ: refuse
          Подтвердить: success
          Вернуть: revert
      Запрошенные параметры (редактирование):
        тип: блок элементов
        локатор: edit-credit-params-tab-form
        элементы:
          Сотрудник, осуществивший продажу:
            тип: выпадающий список
            локатор: select-form-field-seller
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          Личное страхование Заемщика:
            тип: переключатель
            локатор: //input[@data-id='toggle-form-field-insuranceParams']/ancestor::label
            включен: //input[@data-id='toggle-form-field-insuranceParams']/ancestor::label[@class='toggle checked']
          Страховая программа:
            тип: выпадающий список
            локатор: select-form-field-insuranceProgram
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          Вариант страхования:
            тип: радио-кнопка
            локатор: //span[text()='Вариант страхования']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
          Страховая плата: input-form-field-insuranceAmount
          За счет кредитных средств:
            тип: чекбокс
            локатор: //input[@data-id='input-form-field-dateFrom']/..
            установлен: //input[@data-id='input-form-field-dateFrom']/parent::label[@class='checkbox-container checked']
          Вознаграждения Банку: input-form-field-bankReward
          Страховая премия страховой организации: input-form-field-insurancePremium
          Комментарий сотрудника фронт-офиса: text-area-form-field-employeeComment
          Продолжить: success
      Решение банка:
        тип: блок элементов
        локатор: //a[@class='active' and @data-id='bank-decision-credit-tab']/following::div[@class='tab-content']
        элементы:
          Отказ: refuse
          Подтвердить: //span[text()='Подтвердить']/..
          Вернуть: revert
      Создать КОД: success
  Параметры выдачи:
    тип: блок элементов
    локатор: issuance-params
    элементы:
      Сумма кредита: input-form-field-amount
      День платежа:
        тип: выпадающий список
        локатор: select-form-field-payDay
        элементы: //div[@role='option']
        значение: //span[@role='option' and @aria-selected='true']
      Форма расчетов:
        тип: выпадающий список
        локатор: select-form-field-payForm
        элементы: //div[@role='option']
        значение: //span[@role='option' and @aria-selected='true']
      Счет:
        тип: выпадающий список
        локатор: account
        элементы: //div[@role='option']
        значение: //span[@role='option' and @aria-selected='true']
      Создание поручений на перечисление ДС в счет погашения кредитных обязательств:
        тип: переключатель
        локатор: toggle-form-field-creditPaymentOrder
        включен: //input[@data-id='toggle-form-field-creditPaymentOrder']/ancestor::label[@class='toggle checked']
      Далее: next
      Оформить: confirm
      Отмена: revert
  Страхование:
    тип: блок элементов
    локатор: Insurance-tab
    элементы:
      Оформить: confirm
  Заемщик:
    тип: блок элементов
    локатор: //div[@class='tabs tab-progress']
    элементы:
      Меню вкладок подраздела:
        тип: список
        локатор: //ul[@class='tabs__labels']
        названия: //span[@class='tabs-name']
        Кнопки: //parent::a
      Персональные данные:
        тип: блок элементов
        локатор: personal-data
        элементы:
          Образование:
            тип: выпадающий список
            локатор: select-form-field-education
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          СНИЛС: input-form-field-snils
          Военный билет:
            тип: радио-кнопка
            локатор: //span[text()='Военный билет']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
          Тип жилья:
            тип: выпадающий список
            локатор: select-form-field-housingType
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          Семейное положение:
            тип: выпадающий список
            локатор: select-form-field-familyStatus
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          Кол-во детей до 18 лет: input-form-field-underageChildCount
          Кол-во иных иждивенцев, за исключением детей до 18 лет: input-form-field-dependantCount
      Работа:
        тип: блок элементов
        локатор: job-data
        элементы:
          Информация о трудоустройстве:
            тип: выпадающий список
            локатор: select-form-field-employment
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
          Наличие трудовой книжки:
            тип: радио-кнопка
            локатор: //span[text()='Наличие трудовой книжки']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
          Платёжеспособность:
            тип: радио-кнопка
            локатор: //span[text()='Платёжеспособность']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
          Общий стаж за последние 5 лет:
            тип: блок элементов
            локатор: //span[text()='Общий стаж за последние 5 лет']/following::div[@class='field-value'][1]
            элементы:
              лет: input-form-field-fiveYearsExperience-years
              мес.: input-form-field-fiveYearsExperience-months
      Доходы и расходы:
        тип: блок элементов
        локатор: incomes-expenses-data
        элементы:
          Доходы:
            тип: блок элементов
            локатор: //div[text()='Доходы']/following::div[@class='fieldset-content'][1]
            элементы:
              Способ подтверждения дохода по основному месту работы:
                тип: выпадающий список
                локатор: confirm-docmainIncomeConfirmDocument
                элементы: //div[@role='option']
                значение: //span[@role='option' and @aria-selected='true']
              Основная зарплата: //span[text()='Основная зарплата']/following::input[1]
              Способ подтверждения дополнительного дохода:
                тип: выпадающий список
                локатор: confirm-docadditionalIncomeConfirmDocument
                элементы: //div[@role='option']
                значение: //span[@role='option' and @aria-selected='true']
              Доход по совместительству: //span[text()='Доход по совместительству']/following::input[1]
              Способ подтверждения пенсионных доходов:
                тип: выпадающий список
                локатор: confirm-docpensionIncomeConfirmDocument
                элементы: //div[@role='option']
                значение: //span[@role='option' and @aria-selected='true']
              Пенсия: input-form-field-pension
              Способ подтверждения иных доходов:
                тип: выпадающий список
                локатор: confirm-docotherIncomeConfirmDocument
                элементы: //div[@role='option']
                значение: //span[@role='option' and @aria-selected='true']
              Иные доходы: input-form-field-otherIncome
          Расходы:
            тип: блок элементов
            локатор: //div[text()='Расходы']/following::div[@class='fieldset-content'][1]
            элементы:
              Обязательные выплаты: input-form-field-requiredPayments
              Алименты: input-form-field-alimony
      Иная информация:
        тип: блок элементов
        локатор: other-info
        элементы:
          Отношение к воинской службе:
            тип: выпадающий список
            локатор: select-form-field-militaryServiceRelation
            элементы: //div[@role='option']
            значение: //span[@role='option' and @aria-selected='true']
      Продолжить: continue
      Сохранить: save
      Отказ: refuse
  Документы:
    тип: блок элементов
    локатор: credit-document-id
    элементы:
      Документы:
        тип: таблица
        локатор: //table
        заголовки: //th
        строки: //th/parent::tr/following::tr
        столбцы: //td
      Добавить: add-doc-id
      Печать анкеты заявления (односторонняя):
        тип: загрузка файла
        локатор: print-
      Печать анкеты заявления (двусторонняя):
        тип: загрузка файла
        локатор: print-twoSided
      Продолжить: success
  Верификация:
    тип: блок элементов
    локатор: bio-verification-form
    элементы:
      Данные заемщика:
        тип: таблица
        локатор: //table
        заголовки: //th
        строки: //th/parent::tr/following::tr
        столбцы: //td
        элементы:
          Верифицировать: //a[span[text()='Верифицировать']]
      Продолжить: next
      Отказ: refuse
  Визуальная оценка:
    тип: блок элементов
    локатор: visual-assessment-credit-tab-form
    элементы:
      У клиента имеются признаки алкогольного/наркотического опьянения?:
        тип: радио-кнопка
        локатор: //span[text()='У клиента имеются признаки алкогольного/наркотического опьянения?']/following::div[@class='field-value'][1]
      У клиента наблюдаются явные отклонения в психическом состоянии?:
        тип: радио-кнопка
        локатор: //span[text()='У клиента наблюдаются явные отклонения в психическом состоянии?']/following::div[@class='field-value'][1]
      У клиента имеются видимые отклонения в физическом состоянии?:
        тип: радио-кнопка
        локатор: //span[text()='У клиента имеются видимые отклонения в физическом состоянии?']/following::div[@class='field-value'][1]
      У клиента имеются признаки судимости?:
        тип: радио-кнопка
        локатор: //span[text()='У клиента имеются признаки судимости?']/following::div[@class='field-value'][1]
      Ведет ли клиент себя неадекватно?:
        тип: радио-кнопка
        локатор: //span[text()='Ведет ли клиент себя неадекватно?']/following::div[@class='field-value'][1]
      Выглядит ли клиент неопрятно?:
        тип: радио-кнопка
        локатор: //span[text()='Выглядит ли клиент неопрятно?']/following::div[@class='field-value'][1]
      Клиента сопровождают?:
        тип: радио-кнопка
        локатор: //span[text()='Клиента сопровождают?']/following::div[@class='field-value'][1]
      Продолжить: continue
      Отказ: refuse
  История:
    тип: блок элементов
    локатор: history-credit-view
    элементы:
      История:
        тип: таблица
        локатор: //table
        заголовки: //th
        строки: //th/parent::tr/following::tr
        столбцы: //td
  Проверка сведений о доходах:
    тип: блок элементов
    локатор: income-verification-view
    элементы:
      Основной доход:
        тип: блок элементов
        локатор: //div[text()='Основной доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            локатор: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
      Пенсионный доход:
        тип: блок элементов
        локатор: //div[text()='Пенсионный доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            локатор: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
      Дополнительный доход:
        тип: блок элементов
        локатор: //div[text()='Дополнительный доход']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            локатор: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
      Иные доходы:
        тип: блок элементов
        локатор: //div[text()='Иные доходы']/following::div[@class='fieldset-content'][1]
        элементы:
          Сведения о доходе соответствуют заявленным в заявке?:
            тип: радио-кнопка
            локатор: //span[text()='Сведения о доходе соответствуют заявленным в заявке?']/following::div[@class='field-value'][1]
            названия: //li//button/div
            кнопки: //parent::button
      Продолжить: next
      Отказ: refuse
      Вернуть: cancel
  Идентифицировать клиента: identification
Обязательные элементы:
  - Заголовок
Общие блоки элементов:
  - Главное меню
Максимальное время ожидания: по умолчанию