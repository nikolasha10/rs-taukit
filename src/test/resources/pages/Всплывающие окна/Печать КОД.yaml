Название: Печать КОД
Элементы:
  Заголовок: //div[@class='popup-window-title' and text()='Печать КОД']
  Ответственный исполнитель:
    тип: выпадающий список
    локатор: select-employee
    элементы: //div[@role='option']
    значение: //span[@role='option' and @aria-selected='true']
  Печать (односторонняя):
    тип: загрузка файла
    локатор: print-button-
  Печать (двусторонняя):
    тип: загрузка файла
    локатор: print-button-twoSided
  Отмена: cancel-directory-button
Обязательные элементы:
  - Заголовок
Максимальное время ожидания: по умолчанию