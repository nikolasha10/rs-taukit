Название: Приложение скан-копии документов
Элементы:
  Заголовок:
    тип: текст
    xpath: //div[@class='popup-window-title' and text()='Приложение скан-копии документов']
  Тип документа:
    тип: выпадающий список
    test-id: documentType
  Прикрепить файл:
    тип: файл
    test-id: field-scan-attach-file-upload
  Файл:
    тип: ссылка
    xpath: //span[@class='download-filename']/span
  Добавить:
    тип: кнопка
    test-id: attach-scan-button
Обязательные элементы:
  - Заголовок
Максимальное время ожидания: по умолчанию