Название: Задачи
Общие блоки элементов:
  - Главное меню
Элементы:
  Задачи:
    тип: список
    локатор: //div[@class='left-menu-title' and text()='Задачи']/following::ul[1]
    названия: //li/div
    кнопки: //self
  Все задачи:
    тип: блок элементов
    локатор: //div[@class='fieldset-legend' and text()='Все задачи']/ancestor::div[@class='content']
    элементы:
      Все задачи:
        тип: таблица
        локатор: //table
        заголовки: //th
        строки: //th/parent::tr/following::tr
        столбцы: //td
        элементы:
          Взять и исполнить: //span[text()='Взять и исполнить']/..
Обязательные элементы:
  - Задачи
Максимальное время ожидания: по умолчанию