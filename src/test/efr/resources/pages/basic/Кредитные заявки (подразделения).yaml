Адрес: /efr/office-credit-claims-page
Обязательная часть адреса: /efr/office-credit-claims-page
Название: Кредитные заявки (подразделения)
Общие блоки элементов:
  - Главное меню
Элементы:
  Канал подачи:
    тип: выпадающий список
    локатор: channel
    элементы: //div[@role='option']
    значение: //span[@role='option' and @aria-selected='true']
  Заемщик: secondName
  Продуктовая группа:
    тип: выпадающий список
    локатор: creditProductGroupId
    элементы: //div[@role='option']
    значение: //span[@role='option' and @aria-selected='true']
  Статус:
    тип: выпадающий список
    локатор: state
    элементы: //div[@role='option']
    значение: //span[@role='option' and @aria-selected='true']
  Показать: show-button
  Кредитные заявки:
    Тип: таблица
    Локатор: //table
    Заголовки: //th
    Строки: //th/parent::tr/following::tr
    Столбцы: //td
    Элементы:
      Номер заявки:
        Тип: ссылка
        Локатор: //td[1]//a
        Текст: /span
Обязательные элементы:
  - Канал подачи
Максимальное время ожидания: по умолчанию