Название: Прикрепление согласий Заёмщика
Элементы:
  Согласие на обработку персональных данных и получение кредитных отчетов из БКИ:
    тип: контейнер
    xpath: //span[contains(text(),'отчетов из БКИ')]/ancestor::div[starts-with(@class,'field')][last()]
    элементы:
      Прикрепить файл:
        тип: файл
        test-id: documentsBlock-field-name-scan-privacy_policy_and_bki-file-upload
      Файл:
        тип: ссылка
        xpath: //span[@class='download-filename']/span
      Односторонняя печать:
        тип: загрузка файла
        test-id: link-print-privacy_policy_and_bki-
      Двусторонняя печать:
        тип: загрузка файла
        test-id: link-print-privacy_policy_and_bki-twoSided
  Продолжить:
    тип: кнопка
    test-id: button-agreement-signed
  Отмена:
    тип: кнопка
    test-id: button-cancel
Обязательные элементы:
  - Согласие на обработку персональных данных и получение кредитных отчетов из БКИ
Общие блоки элементов:
  - Левый вертикальный блок меню
Максимальное время ожидания: по умолчанию